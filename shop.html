<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <!-- Link CSS -->
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="style.css">
    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- Font Awnsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <!-- ========== HEADER SECTION ========== -->

    <section class="header">
        <header>
            <div class="logo">
                <h1>MasterIT Store</h1>
            </div>
            <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation"
                aria-expanded="false">
                <i class="fa-solid fa-bars" id="menu-icon"></i>
            </button>
            <nav id="menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="shop.html"><i class="fa-solid fa-bag-shopping"></i></a></li>
                </ul>
            </nav>
        </header>
    </section>

    <div class="cart-container">

        <table class="cart-table">

            <thead>
                <tr>
                    <th>Product</th>
                    <th class="center">Quantity</th>
                    <th class="right">Subtotal</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>
                        <div class="product-info">
                            <img src="img/product-1.jpg" alt="">

                            <div>
                                <p>Red Printed T-Shirt</p>
                                <span>Price $500.00</span>
                                <br>
                                <a href="">Remove</a>
                            </div>
                        </div>
                    </td>

                    <td class="center">
                        <input type="number" value="1" min="1">
                    </td>

                    <td class="right">$500.00</td>
                </tr>

                <tr>
                    <td>
                        <div class="product-info">
                            <img src="img/product-2.jpg" alt="">

                            <div>
                                <p>HRX Shoes</p>
                                <span>Price $1500.00</span>
                                <br>
                                <a href="">Remove</a>
                            </div>
                        </div>
                    </td>

                    <td class="center">
                        <input type="number" value="1" min="1">
                    </td>

                    <td class="right">$1500.00</td>
                </tr>

                <tr>
                    <td>
                        <div class="product-info">
                            <img src="img/product-2.jpg" alt="">

                            <div>
                                <p>Reebok Tracksuit</p>
                                <span>Price $1500.00</span>
                                <br>
                                <a href="">Remove</a>
                            </div>
                        </div>
                    </td>

                    <td class="center">
                        <input type="number" value="1" min="1">
                    </td>

                    <td class="right">$1500.00</td>
                </tr>

                <tr>
                    <td colspan="2"></td>

                    <td>
                        <table class="total-table">

                            <tr>
                                <td>Subtotal</td>
                                <td class="right">$3500.00</td>
                            </tr>

                            <tr>
                                <td>Tax</td>
                                <td class="right">$15.00</td>
                            </tr>

                            <tr>
                                <td>Total</td>
                                <td class="right">$3515.00</td>
                            </tr>

                        </table>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>


    <script>
        const menuToggle = document.getElementById("menu-toggle");
        const menu = document.getElementById("menu");
        const menuIcon = document.getElementById("menu-icon");

        menuToggle.addEventListener("click", () => {
            const isOpen = menu.classList.toggle("open");
            menuToggle.setAttribute("aria-expanded", isOpen);

            // Swap between hamburger and close (X) icon
            menuIcon.classList.toggle("fa-bars", !isOpen);
            menuIcon.classList.toggle("fa-xmark", isOpen);
        });

        // Optional: close menu when a link is clicked
        menu.querySelectorAll("a").forEach((link) => {
            link.addEventListener("click", () => {
                menu.classList.remove("open");
                menuToggle.setAttribute("aria-expanded", "false");
                menuIcon.classList.add("fa-bars");
                menuIcon.classList.remove("fa-xmark");
            });
        });
    </script>
</body>

</html>
