<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <!-- Optional: Font Awesome if you want icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="header">
        <header>
            <div class="logo">
                <h1>MasterIT Store</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="shop.html"><i class="fa-solid fa-bag-shopping"></i></a></li>
                </ul>
            </nav>
        </header>
    </section>
    <section class="contact-section">
        <div class="contact-header">
            <span class="contact-tag">Get In Touch</span>
            <h1>Contact Us</h1>
            <p>Have a question about an order, sizing, or a custom request? Send us a message and we will get back to
                you soon.</p>
        </div>
            <form class="contact-form" action="#" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..."
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </section>
</body>

</html>
